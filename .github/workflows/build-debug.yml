# Workflow só do fork: compila o APK debug de qualquer branch para teste em aparelho.
name: build-debug-apk
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou commit a compilar"
        default: "main"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # O runner ubuntu já traz o SDK; só faltam NDK/plataforma e aceitar licenças.
      - name: Instala NDK 28 e plataforma 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleOnlineDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-debug-apk
          path: app/build/outputs/apk/online/debug/*.apk
