# Workflow só do fork: compila e assina o APK de qualquer branch para teste em aparelho.
# A chave de assinatura é fixa (segredos do fork): assim cada build novo instala por cima
# do anterior, sem perder os dados do app.
name: build-test-apk
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou commit a compilar"
        default: "main"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      # Outro applicationId permite instalar ao lado do app oficial: a assinatura de debug
      # difere da release, então o Android recusaria a atualização por cima.
      - name: Gera o APK com id e nome de teste
        run: |
          sed -i 's|applicationId = "com.jarves.mh"|applicationId = "com.jarves.mh"\n        applicationIdSuffix = ".teste"|' app/build.gradle.kts
          sed -i 's|<string name="app_name">Mobile Harness</string>|<string name="app_name">Mobile Harness (teste)</string>|' app/src/main/res/values/strings.xml
          grep -n 'applicationIdSuffix' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # O runner ubuntu já traz o SDK; só faltam NDK/plataforma e aceitar licenças.
      - name: Instala NDK 28 e plataforma 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restaura a chave de assinatura do fork
        env:
          STORE_B64: ${{ secrets.MH_UPLOAD_STORE_BASE64 }}
        run: printf '%s' "$STORE_B64" | base64 -d > fork-release.jks
      - name: Compila e assina o APK
        env:
          MH_UPLOAD_STORE_FILE: fork-release.jks
          MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleOnlineRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-test-apk
          path: app/build/outputs/apk/online/release/*.apk
